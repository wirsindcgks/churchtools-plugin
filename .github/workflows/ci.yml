name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ausdruecklich nur lesen, statt sich auf die Repo-Voreinstellung zu verlassen:
# Die steht heute auf "read", aber ein Workflow soll nicht davon abhaengen, was
# jemand irgendwann in den Einstellungen umstellt.
permissions:
  contents: read

# Actions stehen auf einem Commit-SHA, nicht auf einem Tag. Ein Tag laesst sich
# verschieben - wer die Action uebernimmt, liefe damit in diesem Workflow mit.
# Die Version dahinter ist nur der Kommentar; Dependabot haelt beides aktuell
# (.github/dependabot.yml).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          tools: composer

      - run: composer install --prefer-dist --no-progress

      - run: composer lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          tools: composer

      - run: composer install --prefer-dist --no-progress

      - run: composer test

  # Statische Analyse, Stufe 5 mit Baseline (phpstan.neon.dist). Neue Befunde
  # brechen den Lauf ab; die Baseline soll nur schrumpfen.
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          tools: composer

      - run: composer install --prefer-dist --no-progress

      - run: composer analyse

  # Gegen ein echtes WordPress mit SQLite (tests-integration/): Speichern ueber
  # die Settings-API, Verschluesselung, Migration, Sperre, Weiterleitungen,
  # Deinstallation. Die Installation entsteht bei jedem Lauf frisch.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, sqlite3
          tools: composer, wp-cli

      - run: composer install --prefer-dist --no-progress

      - run: bin/integration-setup.sh "${RUNNER_TEMP}/wordpress"

      - run: composer test:integration
        env:
          CTP_WP_DIR: ${{ runner.temp }}/wordpress

