# Haelt die auf Commit-SHAs gepinnten Actions und die Abhaengigkeiten aktuell
# (Sicherheits-Review 2026-09-14). Ohne diese Datei veralten gepinnte SHAs
# still - das Pinnen schuetzt dann vor verschobenen Tags, aber nicht mehr vor
# bekannten Luecken.
#
# Monatlich und gruppiert: Das Plugin hat einen Maintainer, und eine Flut
# einzelner Pull Requests wuerde eher liegen bleiben als gelesen.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    groups:
      composer:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
